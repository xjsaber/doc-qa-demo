[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-qa-demo"
version = "0.1.0"
description = "Thin document Q&A demo powered by doc2report-agent v1.0.0 core"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "doc2report-agent[qa] @ git+https://github.com/xjsaber/doc2report-agent.git@v1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "playwright>=1.40,<2"]
embedding = [
  "doc2report-agent[embedding] @ git+https://github.com/xjsaber/doc2report-agent.git@v1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
